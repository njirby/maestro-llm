[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maestro"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.3.0",
    "transformers>=4.45.0",
    "trl>=0.11.0",
    "accelerate>=0.34.0",
    "datasets>=2.20.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.2",
    "yt-dlp>=2024.8.6",
    "tensorboard>=2.17.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "pyyaml>=6.0",
    "deepspeed>=0.15.0",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["maestro*", "experiments*"]
