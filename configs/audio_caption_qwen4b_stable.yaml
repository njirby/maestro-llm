data:
  audio_dir: ./data/audio
  prepared_dir: ./data/prepared/musiccaps_v1
  use_prepared: true
  require_prepared: true
  dataset_limit: null  # override to a small value (e.g. 16) for smoke tests

model:
  clap_model_id: laion/larger_clap_general
  qwen_model_id: Qwen/Qwen3.5-4B
  clap_dim: 512
  qwen_hidden_dim: null  # auto-resolved from model config

training:
  output_dir: ./outputs/audio_caption_qwen4b
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  learning_rate: 1.5e-3
  max_length: 256
  logging_steps: 10
  dataloader_num_workers: 0
